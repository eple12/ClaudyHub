<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161512">
<title>Claudy Web</title>
<meta name="description" content="Play and analyse with the Claudy chess engine and Stockfish 19, running locally in your browser (WebAssembly, SIMD, multi-threaded).">
<link rel="icon" href="pieces/wN.svg">
<link rel="stylesheet" href="css/app.css?v=20261030e">
<script src="coi-serviceworker.js"></script>
</head>
<body>
<header id="top">
  <a class="brand" href="./"><img src="pieces/wN.svg" alt=""><span>Claudy Web</span></a>
  <nav id="tabs">
    <button id="tab-play" class="tab on">Play</button>
    <button id="tab-analysis" class="tab">Analysis</button>
  </nav>
  <div class="spacer"></div>
  <span id="chip-sys" class="pill" title="Hardware threads / cross-origin isolation"></span>
  <button id="btn-settings" class="icon" title="Engine settings">&#9881;</button>
</header>

<div id="notice" hidden></div>

<main id="main">
  <div id="app">
    <section id="left">
      <div class="player top" id="ptop"><div class="name"></div><div class="clock"></div></div>
      <div class="board-row">
        <div class="evalbar" id="evalbar"><div class="fill"></div><span class="txt"></span></div>
        <div id="board"></div>
      </div>
      <div class="player bottom" id="pbot"><div class="name"></div><div class="clock"></div></div>
      <div class="controls">
        <button id="nav-first" class="icon" title="Start (Home)">&#9198;</button>
        <button id="nav-prev" class="icon" title="Back (&larr;)">&#9664;</button>
        <button id="nav-next" class="icon" title="Forward (&rarr;)">&#9654;</button>
        <button id="nav-last" class="icon" title="Latest (End)">&#9197;</button>
        <button id="btn-flip" title="Flip board (F)">Flip</button>
        <span class="grow"></span>
        <button id="btn-undo" hidden>Take back</button>
        <button id="btn-hint" hidden>Hint</button>
      </div>
    </section>

    <section id="right">
      <div class="panel" id="p-play">
        <h3>New game</h3>
        <div id="ng">
          <div class="row"><label>White</label><div class="seg" id="ng-white" data-key="white"></div></div>
          <div class="row"><label>Black</label><div class="seg" id="ng-black" data-key="black"></div></div>
          <div class="row"><label>Time</label>
            <select id="ng-tc">
              <option value="60000+0">1 + 0</option>
              <option value="180000+0">3 + 0</option>
              <option value="180000+2000">3 + 2</option>
              <option value="300000+0">5 + 0</option>
              <option value="300000+3000">5 + 3</option>
              <option value="600000+0">10 + 0</option>
              <option value="900000+10000">15 + 10</option>
              <option value="1800000+0">30 + 0</option>
              <option value="0+0">Unlimited (engine thinks for a set time)</option>
            </select>
          </div>
          <div class="row" id="ng-think-row" hidden><label>Engine move time</label>
            <select id="ng-think">
              <option value="500">0.5 s</option><option value="1000">1 s</option><option value="3000">3 s</option>
              <option value="10000">10 s</option><option value="30000">30 s</option>
            </select>
          </div>
          <div id="ng-strength"></div>
          <div class="row btns">
            <button id="ng-start" class="primary">Start game</button>
            <button id="ng-swap" title="Swap colours">&#8646; Swap</button>
          </div>
        </div>
        <div id="ingame" hidden>
          <div id="ig-status" class="big"></div>
          <div id="ig-sub" class="dim small"></div>
          <div class="row btns">
            <button id="ig-pause" hidden>Pause</button>
            <button id="ig-resign" class="danger">Resign</button>
            <button id="ig-new">New game</button>
            <button id="ig-analyze" hidden>Analyse game</button>
          </div>
        </div>
      </div>

      <div class="panel" id="p-analysis" hidden>
        <h3>Analysis board</h3>
        <div class="row"><label>Engines</label>
          <div class="seg multi" id="an-engines"></div>
        </div>
        <div class="row"><label>Lines</label>
          <div class="seg" id="an-lines"></div>
        </div>
        <div class="row btns">
          <button id="an-import">Import PGN / FEN</button>
          <button id="an-copy-pgn">Copy PGN</button>
          <button id="an-copy-fen">Copy FEN</button>
          <button id="an-reset">Reset</button>
        </div>
        <div class="row" id="an-review-row">
          <label>Review</label>
          <select id="an-review-eng"></select>
          <select id="an-review-time">
            <option value="200">0.2 s / move</option><option value="500" selected>0.5 s / move</option>
            <option value="1000">1 s / move</option><option value="2000">2 s / move</option><option value="5000">5 s / move</option>
          </select>
          <button id="an-review" class="primary">Analyse game</button>
        </div>
        <div id="an-progress" hidden><div class="bar"><div></div></div><span class="dim small"></span></div>
        <div id="an-accuracy" class="small" hidden></div>
      </div>

      <div id="engines"></div>

      <div class="panel" id="p-chart">
        <h3>Eval history <span class="dim">White win %</span></h3>
        <div class="chartwrap"><svg id="chart" viewBox="0 0 1000 200" preserveAspectRatio="none"></svg><div id="chart-tip" hidden></div></div>
      </div>

      <div class="panel" id="p-moves"><h3>Moves</h3><div id="moves"></div></div>
    </section>
  </div>
</main>

<footer id="foot">
  <span class="dim">Engines run on your device (WebAssembly) &middot;
  <a href="https://github.com/eple12/ClaudyEngine" target="_blank" rel="noopener">Claudy</a> &middot;
  <a href="https://github.com/nmrugg/stockfish.js" target="_blank" rel="noopener">Stockfish.js</a>
  (<a href="https://github.com/official-stockfish/Stockfish" target="_blank" rel="noopener">Stockfish</a>, GPLv3; <a href="stockfish/COPYING.txt">licence</a>) &middot;
  <a href="https://github.com/jhlywa/chess.js" target="_blank" rel="noopener">chess.js</a> &middot;
  pieces: Caliente by avi (CC BY-NC-SA 4.0)</span>
</footer>

<dialog id="dlg-settings">
  <form method="dialog">
    <h2>Engine settings</h2>
    <div id="set-body"></div>
    <div class="row btns"><button value="close" class="primary">Done</button></div>
  </form>
</dialog>

<dialog id="dlg-import">
  <form method="dialog">
    <h2>Import</h2>
    <p class="dim small">Paste a PGN or a FEN.</p>
    <textarea id="import-text" rows="10" spellcheck="false"></textarea>
    <div id="import-err" class="red small"></div>
    <div class="row btns">
      <button id="import-ok" value="ok" class="primary">Load</button>
      <button value="cancel">Cancel</button>
    </div>
  </form>
</dialog>

<script type="module" src="js/app.js?v=20261030e"></script>
</body>
</html>
